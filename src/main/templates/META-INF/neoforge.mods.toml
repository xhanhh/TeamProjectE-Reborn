modLoader = "javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/yzl210/TeamProjectE/issues"
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"

logoFile= "logo.png"
authors = "${mod_authors}"
credits = "${mod_credits}"
description = '''
ProjectE knowledge and EMC syncing!
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.teamprojecte]]
modId = "neoforge"
mandatory = true
versionRange="[${neo_version}, )"
ordering = "NONE"
side = "BOTH"
[[dependencies.teamprojecte]]
modId = "minecraft"
mandatory = true
versionRange="${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.teamprojecte]]
modId = "projecte"
mandatory = true
versionRange = "[1.0.0,)"
ordering = "NONE"
side = "BOTH"

