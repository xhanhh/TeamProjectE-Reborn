modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
credits="${mod_credits}"
logoFile="logo.png"
description='''
Sync your ProjectE knowledge and EMC with your friends!
With this mod, you will have shared EMC and knowledge with your ProjectE team members!
'''

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neo_version},)"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="projecte"
type="required"
versionRange="[0,)"
ordering="NONE"
side="BOTH"

[[mixins]]
config="teamprojecte.mixins.json"
